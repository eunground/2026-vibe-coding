<script>
/* ===================== 전역 상태 ===================== */
var adminPassword = '';        // 로그인 후 메모리에 보관 (각 관리자 호출에 전달)
var pendingAdminTab = null;    // 로그인 성공 후 이동할 탭

var ADMIN_TABS = ['status', 'manage', 'history'];

/* ===================== 유틸 ===================== */
function $(id) { return document.getElementById(id); }

function showLoading(on) { $('overlay').classList.toggle('show', !!on); }

var toastTimer;
function toast(msg, type) {
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = 'toast'; }, 2800);
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* google.script.run 을 Promise 로 감싸기 */
function call(fnName) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject);
    runner[fnName].apply(runner, args);
  });
}

/* ===================== 탭 전환 ===================== */
function switchTab(tab) {
  // 관리자 탭인데 미로그인 → 로그인 화면 (방어용; 평소 학생에겐 탭이 숨겨져 있음)
  if (ADMIN_TABS.indexOf(tab) >= 0 && !adminPassword) {
    showAdminLogin();
    return;
  }

  setActiveTabButton(tab);
  showOnlyView('view-' + tab);

  if (tab === 'status')  loadStatus();
  if (tab === 'manage')  loadUmbrellas();
  if (tab === 'history') loadHistory();
}

/* 관리자 로그인 화면 열기 (푸터 "관리자 로그인" 링크 진입점) */
function showAdminLogin() {
  if (adminPassword) { switchTab('status'); return; }  // 이미 로그인 상태면 바로 현황으로
  pendingAdminTab = 'status';
  setActiveTabButton('');            // 로그인 중에는 활성 탭 없음
  showOnlyView('view-login');
  $('adminPw').value = '';
  $('loginMsg').textContent = '';
  setTimeout(function () { $('adminPw').focus(); }, 100);
}

function setActiveTabButton(tab) {
  var btns = document.querySelectorAll('.tab');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('active', btns[i].getAttribute('data-tab') === tab);
  }
}

function showOnlyView(viewId) {
  var views = document.querySelectorAll('.view');
  for (var i = 0; i < views.length; i++) {
    var v = views[i];
    var on = v.id === viewId;
    v.classList.toggle('active', on);
    v.style.display = on ? 'block' : 'none';
  }
}

/* ===================== 학생: 우산 스캔 ===================== */
function doScan() {
  var num = $('scanInput').value.trim();
  if (!num) { toast('우산 번호를 입력해주세요.', 'err'); return; }

  showLoading(true);
  call('getUmbrellaStatus', num)
    .then(function (res) {
      showLoading(false);
      if (!res.ok) { toast(res.message, 'err'); return; }
      renderScanResult(res);
    })
    .catch(function (e) { showLoading(false); toast('오류: ' + e.message, 'err'); });
}

function renderScanResult(res) {
  var box = $('scanResult');

  if (!res.registered) {
    box.innerHTML =
      '<div class="card result-card">' +
        '<div class="status-top">' +
          '<span class="umb-num">' + esc(res.umbrellaNumber) + '</span>' +
          '<span class="badge notreg">미등록</span>' +
        '</div>' +
        '<p class="card-desc">등록되지 않은 우산입니다. 관리자에게 문의해주세요.</p>' +
      '</div>';
    return;
  }

  var statusText = { available: '대여 가능', rented: '대여 중', overdue: '연체' }[res.status];

  var html =
    '<div class="card result-card ' + res.status + '">' +
      '<div class="status-top">' +
        '<span class="umb-num">' + esc(res.umbrellaNumber) + '</span>' +
        '<span class="badge ' + res.status + '">' + statusText + '</span>' +
      '</div>' +
      '<div class="umb-name">' + esc(res.umbrellaName || '') + '</div>';

  if (res.status === 'available') {
    // 대여 폼
    html +=
      '<div class="section-label">대여하기 — 정보를 입력하세요</div>' +
      '<div class="form-grid">' +
        '<input type="text" id="rentName" placeholder="이름">' +
        '<input type="text" id="rentSid" inputmode="numeric" placeholder="학번">' +
        '<input type="tel" id="rentPhone" inputmode="tel" placeholder="전화번호 (010-1234-5678)">' +
      '</div>' +
      '<button class="btn btn-success btn-block" onclick="doRent(\'' + esc(res.umbrellaNumber) + '\')">☂️ 대여하기</button>';
  } else {
    // 대여 중 / 연체 → 정보 표시 + 반납 폼
    html +=
      '<div class="info-box">' +
        '<div class="row"><span>대여자</span><span>' + esc(res.renter.name) + '</span></div>' +
        '<div class="row"><span>대여 시간</span><span>' + esc(res.renter.rentTime) + '</span></div>' +
        '<div class="row"><span>경과</span><span>' + esc(res.hours) + '시간</span></div>' +
      '</div>';
    if (res.status === 'overdue') {
      html += '<p class="card-desc" style="color:var(--overdue);font-weight:600">⚠️ 24시간이 지난 연체 상태입니다. 빠른 반납 부탁드려요.</p>';
    }
    html +=
      '<div class="section-label">반납하기 — 본인 확인</div>' +
      '<div class="form-grid">' +
        '<input type="text" id="retName" placeholder="이름">' +
        '<input type="text" id="retSid" inputmode="numeric" placeholder="학번">' +
      '</div>' +
      '<button class="btn btn-primary btn-block" onclick="doReturn(\'' + esc(res.umbrellaNumber) + '\')">✅ 반납하기</button>';
  }

  html += '</div>';
  box.innerHTML = html;
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function doRent(num) {
  var payload = {
    umbrellaNumber: num,
    name: $('rentName').value.trim(),
    studentId: $('rentSid').value.trim(),
    phone: $('rentPhone').value.trim()
  };
  if (!payload.name || !payload.studentId || !payload.phone) {
    toast('모든 항목을 입력해주세요.', 'err'); return;
  }
  showLoading(true);
  call('rentUmbrella', payload)
    .then(function (res) {
      showLoading(false);
      toast(res.message, res.ok ? 'ok' : 'err');
      if (res.ok) { $('scanInput').value = num; doScan(); }
    })
    .catch(function (e) { showLoading(false); toast('오류: ' + e.message, 'err'); });
}

function doReturn(num) {
  var payload = {
    umbrellaNumber: num,
    name: $('retName').value.trim(),
    studentId: $('retSid').value.trim()
  };
  if (!payload.name || !payload.studentId) {
    toast('이름과 학번을 입력해주세요.', 'err'); return;
  }
  showLoading(true);
  call('returnUmbrella', payload)
    .then(function (res) {
      showLoading(false);
      toast(res.message, res.ok ? 'ok' : 'err');
      if (res.ok) { $('scanInput').value = num; doScan(); }
    })
    .catch(function (e) { showLoading(false); toast('오류: ' + e.message, 'err'); });
}

/* ===================== 관리자: 로그인 ===================== */
function doLogin() {
  var pw = $('adminPw').value;
  if (!pw) { $('loginMsg').textContent = '비밀번호를 입력하세요.'; $('loginMsg').className = 'inline-msg err'; return; }

  showLoading(true);
  call('adminLogin', pw)
    .then(function (res) {
      showLoading(false);
      if (res.ok) {
        adminPassword = pw;
        document.body.classList.add('admin-on');   // 관리자 탭 노출
        var go = pendingAdminTab || 'status';
        pendingAdminTab = null;
        switchTab(go);
        toast('관리자로 로그인했습니다.', 'ok');
      } else {
        $('loginMsg').textContent = '비밀번호가 올바르지 않습니다.';
        $('loginMsg').className = 'inline-msg err';
      }
    })
    .catch(function (e) { showLoading(false); $('loginMsg').textContent = '오류: ' + e.message; });
}

function doLogout() {
  adminPassword = '';
  document.body.classList.remove('admin-on');  // 관리자 탭 숨김
  switchTab('scan');
  toast('로그아웃되었습니다.');
}

/* ===================== 관리자: 대여 현황 ===================== */
function loadStatus() {
  showLoading(true);
  Promise.all([call('getAdminStats', adminPassword), call('getActiveRentals', adminPassword)])
    .then(function (r) {
      showLoading(false);
      var stats = r[0], active = r[1];
      if (!stats.ok || !active.ok) { handleAuthFail(stats.message || active.message); return; }

      $('statTotal').textContent = stats.total;
      $('statAvail').textContent = stats.available;
      $('statRented').textContent = stats.rented;
      $('statOverdue').textContent = stats.overdue;

      renderActiveList(active.list);
    })
    .catch(function (e) { showLoading(false); toast('오류: ' + e.message, 'err'); });
}

function renderActiveList(list) {
  var box = $('activeList');
  if (!list.length) { box.innerHTML = '<div class="empty">현재 대여 중인 우산이 없습니다. ☀️</div>'; return; }

  box.innerHTML = list.map(function (it) {
    var cls = it.overdue ? 'overdue' : 'rented';
    var badge = it.overdue
      ? '<span class="badge overdue">연체 ' + it.hours + 'h</span>'
      : '<span class="badge rented">' + it.hours + '시간 경과</span>';
    return '' +
      '<div class="list-item ' + (it.overdue ? 'overdue' : '') + '">' +
        '<span class="dot ' + cls + '"></span>' +
        '<div class="li-main">' +
          '<div class="li-title">' + esc(it.umbrellaNumber) + '번 우산 ' + badge + '</div>' +
          '<div class="li-sub">' + esc(it.name) + ' · ' + esc(it.studentId) + ' · ' + esc(it.phone) + '</div>' +
          '<div class="li-sub">대여: ' + esc(it.rentTime) + '</div>' +
        '</div>' +
        '<div class="li-actions">' +
          '<button class="btn btn-danger" onclick="doForceReturn(\'' + esc(it.umbrellaNumber) + '\')">강제 반납</button>' +
        '</div>' +
      '</div>';
  }).join('');
}

function doForceReturn(num) {
  if (!confirm(num + '번 우산을 강제 반납 처리할까요?')) return;
  showLoading(true);
  call('forceReturn', adminPassword, num)
    .then(function (res) {
      showLoading(false);
      toast(res.message, res.ok ? 'ok' : 'err');
      if (res.ok) loadStatus();
    })
    .catch(function (e) { showLoading(false); toast('오류: ' + e.message, 'err'); });
}

/* ===================== 관리자: 우산 관리 ===================== */
function doRegister() {
  var payload = {
    umbrellaNumber: $('newUmbNumber').value.trim(),
    umbrellaName: $('newUmbName').value.trim()
  };
  if (!payload.umbrellaNumber) { toast('우산 번호를 입력해주세요.', 'err'); return; }

  showLoading(true);
  call('registerUmbrella', adminPassword, payload)
    .then(function (res) {
      showLoading(false);
      var m = $('manageMsg');
      m.textContent = res.message;
      m.className = 'inline-msg ' + (res.ok ? 'ok' : 'err');
      if (res.ok) { $('newUmbNumber').value = ''; $('newUmbName').value = ''; loadUmbrellas(); }
    })
    .catch(function (e) { showLoading(false); toast('오류: ' + e.message, 'err'); });
}

function loadUmbrellas() {
  showLoading(true);
  call('getAllUmbrellas', adminPassword)
    .then(function (res) {
      showLoading(false);
      if (!res.ok) { handleAuthFail(res.message); return; }
      renderUmbList(res.list);
    })
    .catch(function (e) { showLoading(false); toast('오류: ' + e.message, 'err'); });
}

function renderUmbList(list) {
  var box = $('umbList');
  if (!list.length) { box.innerHTML = '<div class="empty">등록된 우산이 없습니다. 위에서 등록해보세요.</div>'; return; }

  var statusText = { available: '대여 가능', rented: '대여 중', overdue: '연체' };
  box.innerHTML = list.map(function (it) {
    return '' +
      '<div class="list-item">' +
        '<span class="dot ' + it.status + '"></span>' +
        '<div class="li-main">' +
          '<div class="li-title">' + esc(it.umbrellaNumber) + '번 ' +
            '<span class="badge ' + it.status + '">' + statusText[it.status] + '</span></div>' +
          '<div class="li-sub">' + esc(it.umbrellaName) + ' · 등록 ' + esc(it.regDate) + '</div>' +
        '</div>' +
        '<div class="li-actions">' +
          '<button class="btn btn-outline" onclick="showQr(\'' + esc(it.umbrellaNumber) + '\',\'' +
            encodeURIComponent(it.qrUrl) + '\',\'' + encodeURIComponent(it.link) + '\')">QR</button>' +
          '<button class="btn btn-danger" onclick="doDelete(\'' + esc(it.umbrellaNumber) + '\')">삭제</button>' +
        '</div>' +
      '</div>';
  }).join('');
}

function doDelete(num) {
  if (!confirm(num + '번 우산을 삭제할까요?')) return;
  showLoading(true);
  call('deleteUmbrella', adminPassword, num)
    .then(function (res) {
      showLoading(false);
      toast(res.message, res.ok ? 'ok' : 'err');
      if (res.ok) loadUmbrellas();
    })
    .catch(function (e) { showLoading(false); toast('오류: ' + e.message, 'err'); });
}

/* ===================== QR 모달 ===================== */
function showQr(num, qrUrlEnc, linkEnc) {
  var qrUrl = decodeURIComponent(qrUrlEnc);
  var link = decodeURIComponent(linkEnc);
  if (!qrUrl) { toast('웹앱이 아직 배포되지 않아 QR을 만들 수 없습니다. (배포 후 이용)', 'err'); return; }

  $('qrTitle').textContent = num + '번 우산 QR';
  $('qrImage').src = qrUrl;
  $('qrLink').textContent = link;
  var dl = $('qrDownload');
  dl.href = qrUrl;
  dl.setAttribute('download', 'umbrella-' + num + '-qr.png');
  $('qrModal').classList.add('show');
}

function closeQr() { $('qrModal').classList.remove('show'); }

/* ===================== 관리자: 대여 기록 ===================== */
function loadHistory() {
  showLoading(true);
  call('getRentalHistory', adminPassword)
    .then(function (res) {
      showLoading(false);
      if (!res.ok) { handleAuthFail(res.message); return; }
      renderHistory(res.list);
    })
    .catch(function (e) { showLoading(false); toast('오류: ' + e.message, 'err'); });
}

function renderHistory(list) {
  var body = $('historyBody');
  if (!list.length) { body.innerHTML = '<tr><td colspan="6" class="empty">대여 기록이 없습니다.</td></tr>'; return; }

  body.innerHTML = list.map(function (it) {
    var isRented = it.status === '대여중';
    var tag = '<span class="tag ' + (isRented ? 'rented' : 'returned') + '">' + esc(it.status) + '</span>';
    return '<tr>' +
      '<td>' + esc(it.umbrellaNumber) + '</td>' +
      '<td>' + esc(it.name) + '</td>' +
      '<td>' + esc(it.studentId) + '</td>' +
      '<td>' + esc(it.rentTime) + '</td>' +
      '<td>' + (it.returnTime ? esc(it.returnTime) : '-') + '</td>' +
      '<td>' + tag + '</td>' +
    '</tr>';
  }).join('');
}

/* 인증 만료/실패 처리 */
function handleAuthFail(msg) {
  toast(msg || '다시 로그인해주세요.', 'err');
  adminPassword = '';
  document.body.classList.remove('admin-on');  // 관리자 탭 숨김
  switchTab('scan');
}

/* ===================== 이벤트 바인딩 / 초기화 ===================== */
document.addEventListener('DOMContentLoaded', function () {
  // 탭
  document.querySelectorAll('.tab').forEach(function (btn) {
    btn.addEventListener('click', function () { switchTab(btn.getAttribute('data-tab')); });
  });

  // 스캔
  $('scanBtn').addEventListener('click', doScan);
  $('scanInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') doScan(); });

  // 관리자 진입 / 로그인
  $('adminEntry').addEventListener('click', showAdminLogin);
  $('loginCancel').addEventListener('click', function () { switchTab('scan'); });
  $('loginBtn').addEventListener('click', doLogin);
  $('adminPw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  $('logoutBtn1').addEventListener('click', doLogout);
  $('logoutBtn2').addEventListener('click', doLogout);
  $('logoutBtn3').addEventListener('click', doLogout);

  // 현황/관리/기록 새로고침
  $('refreshStatus').addEventListener('click', loadStatus);
  $('refreshManage').addEventListener('click', loadUmbrellas);
  $('refreshHistory').addEventListener('click', loadHistory);

  // 우산 등록
  $('registerBtn').addEventListener('click', doRegister);

  // QR 모달
  $('qrClose').addEventListener('click', closeQr);
  $('qrModal').addEventListener('click', function (e) { if (e.target === $('qrModal')) closeQr(); });

  // QR 링크로 진입한 경우 자동 조회
  if (INITIAL_UMBRELLA) {
    $('scanInput').value = INITIAL_UMBRELLA;
    switchTab('scan');
    doScan();
  }
});
</script>
