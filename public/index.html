<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>학교 우산 대여</title>
  <style>
/* ===================== 기본 / 변수 ===================== */
:root {
  --primary: #1a73e8;
  --primary-dark: #1557b0;
  --bg: #f1f5f9;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #e5e7eb;

  --avail: #16a34a;       --avail-bg: #dcfce7;
  --rented: #ea8600;      --rented-bg: #fef3c7;
  --overdue: #dc2626;     --overdue-bg: #fee2e2;

  --radius: 14px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic",
               "Apple SD Gothic Neo", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 760px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===================== 헤더 ===================== */
.app-header {
  background: linear-gradient(135deg, var(--primary), #4f46e5);
  color: #fff;
  padding: 22px 18px;
  padding-top: calc(22px + env(safe-area-inset-top));
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand-logo { font-size: 38px; line-height: 1; }
.brand-text h1 { font-size: 21px; font-weight: 700; }
.brand-text p { font-size: 13px; opacity: .9; margin-top: 2px; }

/* ===================== 탭 ===================== */
.tabs {
  display: flex;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1 0 auto;
  padding: 14px 12px;
  border: none;
  background: none;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 3px solid transparent;
  transition: color .15s, border-color .15s;
}
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }

.tab.admin-only { display: none; }
body.admin-on .tab.admin-only { display: block; }

/* ===================== 콘텐츠 ===================== */
.content { flex: 1; padding: 16px; }
.view { display: none; animation: fade .25s ease; }
.view.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ===================== 카드 ===================== */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
  margin-bottom: 16px;
}
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-title { font-size: 17px; font-weight: 700; }
.card-desc { font-size: 13.5px; color: var(--muted); margin: 6px 0 14px; }

/* ===================== 입력 / 버튼 ===================== */
input {
  width: 100%;
  padding: 13px 14px;
  font-size: 16px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  background: #fff;
  color: var(--text);
  transition: border-color .15s;
}
input:focus { outline: none; border-color: var(--primary); }

.search-row { display: flex; gap: 8px; }
.search-row input { flex: 1; }
.search-row .btn { flex: 0 0 auto; }

.form-grid { display: grid; gap: 10px; margin-bottom: 12px; }

.btn {
  padding: 13px 20px;
  font-size: 15px;
  font-weight: 700;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: transform .05s, background .15s, opacity .15s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-block { display: block; width: 100%; }
.btn-success { background: var(--avail); color: #fff; }
.btn-danger { background: var(--overdue); color: #fff; }
.btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
.btn:disabled { opacity: .55; cursor: default; }

.btn-text {
  background: none; border: none; color: var(--primary);
  font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 4px;
}

.inline-msg { margin-top: 10px; font-size: 14px; min-height: 18px; }
.inline-msg.ok { color: var(--avail); }
.inline-msg.err { color: var(--overdue); }

/* ===================== 우산 상태 결과 카드 ===================== */
.result-card { border-left: 6px solid var(--border); }
.result-card.available { border-left-color: var(--avail); }
.result-card.rented    { border-left-color: var(--rented); }
.result-card.overdue   { border-left-color: var(--overdue); }

.status-top { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.umb-num { font-size: 26px; font-weight: 800; }
.umb-name { font-size: 14px; color: var(--muted); }

.badge {
  display: inline-block; padding: 5px 12px; border-radius: 999px;
  font-size: 13px; font-weight: 700;
}
.badge.available { background: var(--avail-bg); color: var(--avail); }
.badge.rented    { background: var(--rented-bg); color: var(--rented); }
.badge.overdue   { background: var(--overdue-bg); color: var(--overdue); }
.badge.notreg    { background: #e5e7eb; color: var(--muted); }

.info-box {
  background: var(--bg); border-radius: 10px; padding: 12px 14px;
  margin: 14px 0; font-size: 14px;
}
.info-box .row { display: flex; justify-content: space-between; padding: 3px 0; }
.info-box .row span:first-child { color: var(--muted); }
.info-box .row span:last-child { font-weight: 600; }

.section-label { font-size: 13px; font-weight: 700; color: var(--muted); margin: 16px 0 8px; }

/* ===================== 통계 그리드 ===================== */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
.stat {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px 8px; text-align: center;
}
.stat-num { display: block; font-size: 26px; font-weight: 800; line-height: 1.1; }
.stat-label { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.stat-total .stat-num { color: var(--primary); }
.stat-avail .stat-num { color: var(--avail); }
.stat-rented .stat-num { color: var(--rented); }
.stat-overdue .stat-num { color: var(--overdue); }

/* ===================== 리스트 ===================== */
.list { display: flex; flex-direction: column; gap: 10px; }
.list-item {
  border: 1px solid var(--border); border-radius: 12px; padding: 14px;
  display: flex; align-items: center; gap: 12px;
}
.list-item.overdue { border-color: var(--overdue); background: var(--overdue-bg); }
.li-main { flex: 1; min-width: 0; }
.li-title { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.li-sub { font-size: 13px; color: var(--muted); margin-top: 4px; word-break: break-all; }
.li-actions { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
.li-actions .btn { padding: 9px 14px; font-size: 13px; }

.dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
.dot.available { background: var(--avail); }
.dot.rented { background: var(--rented); }
.dot.overdue { background: var(--overdue); }

.empty { text-align: center; color: var(--muted); padding: 28px 10px; font-size: 14px; }

/* ===================== 관리자 바 ===================== */
.admin-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.admin-badge {
  background: #eef2ff; color: var(--primary); font-size: 13px; font-weight: 700;
  padding: 6px 12px; border-radius: 999px;
}

/* ===================== 로그인 ===================== */
.login-card { text-align: center; max-width: 380px; margin: 30px auto; }
.lock-icon { font-size: 44px; margin-bottom: 8px; }
.login-card .search-row { margin-top: 8px; }

/* ===================== 테이블 ===================== */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 520px; }
.data-table th, .data-table td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
.data-table th { color: var(--muted); font-weight: 700; background: var(--bg); position: sticky; top: 0; }
.tag { padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.tag.rented { background: var(--rented-bg); color: var(--rented); }
.tag.returned { background: var(--avail-bg); color: var(--avail); }

/* ===================== QR 모달 ===================== */
.modal {
  display: none; position: fixed; inset: 0; z-index: 50;
  background: rgba(0,0,0,.55); align-items: center; justify-content: center; padding: 20px;
}
.modal.show { display: flex; }
.modal-box {
  background: #fff; border-radius: 18px; padding: 24px; text-align: center;
  max-width: 340px; width: 100%; position: relative;
}
.modal-box h3 { font-size: 18px; margin-bottom: 16px; }
.modal-box img { width: 220px; height: 220px; border-radius: 10px; }
.modal-close {
  position: absolute; top: 12px; right: 14px; background: none; border: none;
  font-size: 20px; cursor: pointer; color: var(--muted);
}
.qr-link { font-size: 12px; color: var(--muted); margin: 12px 0 16px; word-break: break-all; }

/* ===================== 로딩 / 토스트 ===================== */
.overlay {
  display: none; position: fixed; inset: 0; z-index: 60;
  background: rgba(255,255,255,.6); align-items: center; justify-content: center;
}
.overlay.show { display: flex; }
.spinner {
  width: 42px; height: 42px; border: 4px solid var(--border);
  border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
  background: #1f2937; color: #fff; padding: 13px 20px; border-radius: 10px;
  font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s; z-index: 70; max-width: 90%; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--overdue); }
.toast.ok { background: var(--avail); }

/* ===================== 푸터 ===================== */
.app-footer {
  text-align: center; font-size: 12px; color: var(--muted);
  padding: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom));
}
.admin-entry {
  display: inline-block; margin-top: 10px;
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 12px; text-decoration: underline;
  padding: 6px 10px;
}
body.admin-on .admin-entry { display: none; }

/* ===================== 반응형 ===================== */
@media (max-width: 480px) {
  .brand-text h1 { font-size: 18px; }
  .tab { font-size: 13px; padding: 13px 10px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .umb-num { font-size: 22px; }
  .list-item { flex-direction: column; align-items: stretch; }
  .li-actions { flex-direction: row; }
  .li-actions .btn { flex: 1; }
}

@media (min-width: 768px) {
  .form-grid { grid-template-columns: 1fr 1fr; }
}
  </style>
</head>
<body>
  <div class="app">

    <header class="app-header">
      <div class="brand">
        <span class="brand-logo">☂️</span>
        <div class="brand-text">
          <h1>학교 우산 대여</h1>
          <p>필요할 때 빌리고, 다 쓰면 반납해요</p>
        </div>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="scan">🔍 우산 스캔</button>
      <button class="tab admin-only" data-tab="status">📋 대여 현황</button>
      <button class="tab admin-only" data-tab="manage">☂️ 우산 관리</button>
      <button class="tab admin-only" data-tab="history">🕓 대여 기록</button>
    </nav>

    <main class="content">

      <!-- 1. 우산 스캔 -->
      <section class="view active" id="view-scan">
        <div class="card">
          <h2 class="card-title">우산 번호 확인</h2>
          <p class="card-desc">우산에 적힌 번호를 입력하거나 QR을 스캔해 접속하세요.</p>
          <div class="search-row">
            <input type="text" id="scanInput" inputmode="text" placeholder="예: 12" autocomplete="off">
            <button class="btn btn-primary" id="scanBtn">확인</button>
          </div>
        </div>
        <div id="scanResult"></div>
      </section>

      <!-- 관리자 로그인 -->
      <section class="view" id="view-login" style="display:none">
        <div class="card login-card">
          <div class="lock-icon">🔒</div>
          <h2 class="card-title">관리자 로그인</h2>
          <p class="card-desc">관리자 비밀번호를 입력하세요.</p>
          <div class="search-row">
            <input type="password" id="adminPw" placeholder="비밀번호" autocomplete="current-password">
            <button class="btn btn-primary" id="loginBtn">로그인</button>
          </div>
          <div id="loginMsg" class="inline-msg"></div>
          <button class="btn-text" id="loginCancel">← 학생 화면으로 돌아가기</button>
        </div>
      </section>

      <!-- 2. 대여 현황 -->
      <section class="view admin-view" id="view-status">
        <div class="admin-bar">
          <span class="admin-badge">👤 관리자</span>
          <button class="btn-text" id="logoutBtn1">로그아웃</button>
        </div>

        <div class="stats-grid">
          <div class="stat stat-total">  <span class="stat-num" id="statTotal">-</span>   <span class="stat-label">전체 우산</span></div>
          <div class="stat stat-avail">  <span class="stat-num" id="statAvail">-</span>   <span class="stat-label">대여 가능</span></div>
          <div class="stat stat-rented"> <span class="stat-num" id="statRented">-</span>  <span class="stat-label">대여 중</span></div>
          <div class="stat stat-overdue"><span class="stat-num" id="statOverdue">-</span> <span class="stat-label">연체</span></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2 class="card-title">대여 중인 우산</h2>
            <button class="btn-text" id="refreshStatus">↻ 새로고침</button>
          </div>
          <div id="activeList" class="list"></div>
        </div>
      </section>

      <!-- 3. 우산 관리 -->
      <section class="view admin-view" id="view-manage">
        <div class="admin-bar">
          <span class="admin-badge">👤 관리자</span>
          <button class="btn-text" id="logoutBtn2">로그아웃</button>
        </div>

        <div class="card">
          <h2 class="card-title">우산 등록</h2>
          <div class="form-grid">
            <input type="text" id="newUmbNumber" placeholder="우산 번호 (예: 12)">
            <input type="text" id="newUmbName" placeholder="우산명 (선택, 예: 장우산)">
          </div>
          <button class="btn btn-primary btn-block" id="registerBtn">＋ 우산 등록</button>
          <div id="manageMsg" class="inline-msg"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2 class="card-title">등록된 우산 · QR</h2>
            <button class="btn-text" id="refreshManage">↻ 새로고침</button>
          </div>
          <div id="umbList" class="list"></div>
        </div>
      </section>

      <!-- 4. 대여 기록 -->
      <section class="view admin-view" id="view-history">
        <div class="admin-bar">
          <span class="admin-badge">👤 관리자</span>
          <button class="btn-text" id="logoutBtn3">로그아웃</button>
        </div>

        <div class="card">
          <div class="card-head">
            <h2 class="card-title">전체 대여 기록</h2>
            <button class="btn-text" id="refreshHistory">↻ 새로고침</button>
          </div>
          <div class="table-wrap">
            <table class="data-table" id="historyTable">
              <thead>
                <tr><th>우산</th><th>이름</th><th>학번</th><th>대여</th><th>반납</th><th>상태</th></tr>
              </thead>
              <tbody id="historyBody"></tbody>
            </table>
          </div>
        </div>
      </section>

    </main>

    <footer class="app-footer">
      ☔ 우산 대여 시스템 · 24시간 이상 미반납 시 연체 처리<br>
      <button class="admin-entry" id="adminEntry">관리자 로그인</button>
    </footer>
  </div>

  <div class="overlay" id="overlay"><div class="spinner"></div></div>

  <div class="modal" id="qrModal">
    <div class="modal-box">
      <button class="modal-close" id="qrClose">✕</button>
      <h3 id="qrTitle">QR 코드</h3>
      <img id="qrImage" alt="QR 코드" />
      <p class="qr-link" id="qrLink"></p>
      <a class="btn btn-primary btn-block" id="qrDownload" download>QR 이미지 저장</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  /* ===================== 전역 상태 ===================== */
  var adminPassword = '';
  var pendingAdminTab = null;
  var ADMIN_TABS = ['status', 'manage', 'history'];

  var INITIAL_UMBRELLA = new URLSearchParams(location.search).get('umbrella') || '';

  /* ===================== 유틸 ===================== */
  function $(id) { return document.getElementById(id); }

  function showLoading(on) { $('overlay').classList.toggle('show', !!on); }

  var toastTimer;
  function toast(msg, type) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast'; }, 2800);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* HTTP 호출 헬퍼 (옛 call() 자리) */
  async function api(path, opts) {
    opts = opts || {};
    var method = opts.method || 'GET';
    var headers = {};
    if (opts.body) headers['Content-Type'] = 'application/json';
    if (opts.admin) headers['x-admin-password'] = adminPassword;

    try {
      var res = await fetch('/api' + path, {
        method: method,
        headers: headers,
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      });
      var data = await res.json().catch(function () { return null; });
      if (!data) return { ok: false, message: '서버 응답 오류' };
      return data;
    } catch (e) {
      return { ok: false, message: '네트워크 오류: ' + e.message };
    }
  }

  /* ===================== 탭 전환 ===================== */
  function switchTab(tab) {
    if (ADMIN_TABS.indexOf(tab) >= 0 && !adminPassword) {
      showAdminLogin();
      return;
    }
    setActiveTabButton(tab);
    showOnlyView('view-' + tab);
    if (tab === 'status')  loadStatus();
    if (tab === 'manage')  loadUmbrellas();
    if (tab === 'history') loadHistory();
  }

  function showAdminLogin() {
    if (adminPassword) { switchTab('status'); return; }
    pendingAdminTab = 'status';
    setActiveTabButton('');
    showOnlyView('view-login');
    $('adminPw').value = '';
    $('loginMsg').textContent = '';
    setTimeout(function () { $('adminPw').focus(); }, 100);
  }

  function setActiveTabButton(tab) {
    var btns = document.querySelectorAll('.tab');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('active', btns[i].getAttribute('data-tab') === tab);
    }
  }

  function showOnlyView(viewId) {
    var views = document.querySelectorAll('.view');
    for (var i = 0; i < views.length; i++) {
      var v = views[i];
      var on = v.id === viewId;
      v.classList.toggle('active', on);
      v.style.display = on ? 'block' : 'none';
    }
  }

  /* ===================== 학생: 우산 스캔 ===================== */
  async function doScan() {
    var num = $('scanInput').value.trim();
    if (!num) { toast('우산 번호를 입력해주세요.', 'err'); return; }

    showLoading(true);
    var res = await api('/status?umbrella=' + encodeURIComponent(num));
    showLoading(false);
    if (!res.ok) { toast(res.message, 'err'); return; }
    renderScanResult(res);
  }

  function renderScanResult(res) {
    var box = $('scanResult');

    if (!res.registered) {
      box.innerHTML =
        '<div class="card result-card">' +
          '<div class="status-top">' +
            '<span class="umb-num">' + esc(res.umbrellaNumber) + '</span>' +
            '<span class="badge notreg">미등록</span>' +
          '</div>' +
          '<p class="card-desc">등록되지 않은 우산입니다. 관리자에게 문의해주세요.</p>' +
        '</div>';
      return;
    }

    var statusText = { available: '대여 가능', rented: '대여 중', overdue: '연체' }[res.status];

    var html =
      '<div class="card result-card ' + res.status + '">' +
        '<div class="status-top">' +
          '<span class="umb-num">' + esc(res.umbrellaNumber) + '</span>' +
          '<span class="badge ' + res.status + '">' + statusText + '</span>' +
        '</div>' +
        '<div class="umb-name">' + esc(res.umbrellaName || '') + '</div>';

    if (res.status === 'available') {
      html +=
        '<div class="section-label">대여하기 — 정보를 입력하세요</div>' +
        '<div class="form-grid">' +
          '<input type="text" id="rentName" placeholder="이름">' +
          '<input type="text" id="rentSid" inputmode="numeric" placeholder="학번">' +
          '<input type="tel" id="rentPhone" inputmode="tel" placeholder="전화번호 (010-1234-5678)">' +
        '</div>' +
        '<button class="btn btn-success btn-block" onclick="doRent(\'' + esc(res.umbrellaNumber) + '\')">☂️ 대여하기</button>';
    } else {
      html +=
        '<div class="info-box">' +
          '<div class="row"><span>대여자</span><span>' + esc(res.renter.name) + '</span></div>' +
          '<div class="row"><span>대여 시간</span><span>' + esc(res.renter.rentTime) + '</span></div>' +
          '<div class="row"><span>경과</span><span>' + esc(res.hours) + '시간</span></div>' +
        '</div>';
      if (res.status === 'overdue') {
        html += '<p class="card-desc" style="color:var(--overdue);font-weight:600">⚠️ 24시간이 지난 연체 상태입니다. 빠른 반납 부탁드려요.</p>';
      }
      html +=
        '<div class="section-label">반납하기 — 본인 확인</div>' +
        '<div class="form-grid">' +
          '<input type="text" id="retName" placeholder="이름">' +
          '<input type="text" id="retSid" inputmode="numeric" placeholder="학번">' +
        '</div>' +
        '<button class="btn btn-primary btn-block" onclick="doReturn(\'' + esc(res.umbrellaNumber) + '\')">✅ 반납하기</button>';
    }

    html += '</div>';
    box.innerHTML = html;
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  async function doRent(num) {
    var payload = {
      umbrellaNumber: num,
      name: $('rentName').value.trim(),
      studentId: $('rentSid').value.trim(),
      phone: $('rentPhone').value.trim()
    };
    if (!payload.name || !payload.studentId || !payload.phone) {
      toast('모든 항목을 입력해주세요.', 'err'); return;
    }
    showLoading(true);
    var res = await api('/rent', { method: 'POST', body: payload });
    showLoading(false);
    toast(res.message, res.ok ? 'ok' : 'err');
    if (res.ok) { $('scanInput').value = num; doScan(); }
  }

  async function doReturn(num) {
    var payload = {
      umbrellaNumber: num,
      name: $('retName').value.trim(),
      studentId: $('retSid').value.trim()
    };
    if (!payload.name || !payload.studentId) {
      toast('이름과 학번을 입력해주세요.', 'err'); return;
    }
    showLoading(true);
    var res = await api('/return', { method: 'POST', body: payload });
    showLoading(false);
    toast(res.message, res.ok ? 'ok' : 'err');
    if (res.ok) { $('scanInput').value = num; doScan(); }
  }

  /* ===================== 관리자: 로그인 ===================== */
  async function doLogin() {
    var pw = $('adminPw').value;
    if (!pw) { $('loginMsg').textContent = '비밀번호를 입력하세요.'; $('loginMsg').className = 'inline-msg err'; return; }

    showLoading(true);
    // 비밀번호 후보를 헤더에 실어 검증
    adminPassword = pw;
    var res = await api('/admin/login', { method: 'POST', admin: true });
    showLoading(false);
    if (res.ok) {
      document.body.classList.add('admin-on');
      var go = pendingAdminTab || 'status';
      pendingAdminTab = null;
      switchTab(go);
      toast('관리자로 로그인했습니다.', 'ok');
    } else {
      adminPassword = '';
      $('loginMsg').textContent = '비밀번호가 올바르지 않습니다.';
      $('loginMsg').className = 'inline-msg err';
    }
  }

  function doLogout() {
    adminPassword = '';
    document.body.classList.remove('admin-on');
    switchTab('scan');
    toast('로그아웃되었습니다.');
  }

  /* ===================== 관리자: 대여 현황 ===================== */
  async function loadStatus() {
    showLoading(true);
    var pair = await Promise.all([
      api('/admin/stats',  { admin: true }),
      api('/admin/active', { admin: true })
    ]);
    showLoading(false);
    var stats = pair[0], active = pair[1];
    if (!stats.ok || !active.ok) { handleAuthFail(stats.message || active.message); return; }

    $('statTotal').textContent   = stats.total;
    $('statAvail').textContent   = stats.available;
    $('statRented').textContent  = stats.rented;
    $('statOverdue').textContent = stats.overdue;

    renderActiveList(active.list);
  }

  function renderActiveList(list) {
    var box = $('activeList');
    if (!list.length) { box.innerHTML = '<div class="empty">현재 대여 중인 우산이 없습니다. ☀️</div>'; return; }

    box.innerHTML = list.map(function (it) {
      var cls = it.overdue ? 'overdue' : 'rented';
      var badge = it.overdue
        ? '<span class="badge overdue">연체 ' + it.hours + 'h</span>'
        : '<span class="badge rented">' + it.hours + '시간 경과</span>';
      return '' +
        '<div class="list-item ' + (it.overdue ? 'overdue' : '') + '">' +
          '<span class="dot ' + cls + '"></span>' +
          '<div class="li-main">' +
            '<div class="li-title">' + esc(it.umbrellaNumber) + '번 우산 ' + badge + '</div>' +
            '<div class="li-sub">' + esc(it.name) + ' · ' + esc(it.studentId) + ' · ' + esc(it.phone) + '</div>' +
            '<div class="li-sub">대여: ' + esc(it.rentTime) + '</div>' +
          '</div>' +
          '<div class="li-actions">' +
            '<button class="btn btn-danger" onclick="doForceReturn(\'' + esc(it.umbrellaNumber) + '\')">강제 반납</button>' +
          '</div>' +
        '</div>';
    }).join('');
  }

  async function doForceReturn(num) {
    if (!confirm(num + '번 우산을 강제 반납 처리할까요?')) return;
    showLoading(true);
    var res = await api('/admin/force-return', {
      method: 'POST', admin: true, body: { umbrellaNumber: num }
    });
    showLoading(false);
    toast(res.message, res.ok ? 'ok' : 'err');
    if (res.ok) loadStatus();
  }

  /* ===================== 관리자: 우산 관리 ===================== */
  async function doRegister() {
    var payload = {
      umbrellaNumber: $('newUmbNumber').value.trim(),
      umbrellaName: $('newUmbName').value.trim()
    };
    if (!payload.umbrellaNumber) { toast('우산 번호를 입력해주세요.', 'err'); return; }

    showLoading(true);
    var res = await api('/admin/register', { method: 'POST', admin: true, body: payload });
    showLoading(false);
    var m = $('manageMsg');
    m.textContent = res.message;
    m.className = 'inline-msg ' + (res.ok ? 'ok' : 'err');
    if (res.ok) { $('newUmbNumber').value = ''; $('newUmbName').value = ''; loadUmbrellas(); }
  }

  async function loadUmbrellas() {
    showLoading(true);
    var res = await api('/admin/list', { admin: true });
    showLoading(false);
    if (!res.ok) { handleAuthFail(res.message); return; }
    renderUmbList(res.list);
  }

  function renderUmbList(list) {
    var box = $('umbList');
    if (!list.length) { box.innerHTML = '<div class="empty">등록된 우산이 없습니다. 위에서 등록해보세요.</div>'; return; }

    var statusText = { available: '대여 가능', rented: '대여 중', overdue: '연체' };
    box.innerHTML = list.map(function (it) {
      return '' +
        '<div class="list-item">' +
          '<span class="dot ' + it.status + '"></span>' +
          '<div class="li-main">' +
            '<div class="li-title">' + esc(it.umbrellaNumber) + '번 ' +
              '<span class="badge ' + it.status + '">' + statusText[it.status] + '</span></div>' +
            '<div class="li-sub">' + esc(it.umbrellaName) + ' · 등록 ' + esc(it.regDate) + '</div>' +
          '</div>' +
          '<div class="li-actions">' +
            '<button class="btn btn-outline" onclick="showQr(\'' + esc(it.umbrellaNumber) + '\',\'' +
              encodeURIComponent(it.qrUrl) + '\',\'' + encodeURIComponent(it.link) + '\')">QR</button>' +
            '<button class="btn btn-danger" onclick="doDelete(\'' + esc(it.umbrellaNumber) + '\')">삭제</button>' +
          '</div>' +
        '</div>';
    }).join('');
  }

  async function doDelete(num) {
    if (!confirm(num + '번 우산을 삭제할까요?')) return;
    showLoading(true);
    var res = await api('/admin/delete', {
      method: 'POST', admin: true, body: { umbrellaNumber: num }
    });
    showLoading(false);
    toast(res.message, res.ok ? 'ok' : 'err');
    if (res.ok) loadUmbrellas();
  }

  /* ===================== QR 모달 ===================== */
  function showQr(num, qrUrlEnc, linkEnc) {
    var qrUrl = decodeURIComponent(qrUrlEnc);
    var link = decodeURIComponent(linkEnc);
    if (!qrUrl) { toast('QR을 만들 수 없습니다.', 'err'); return; }

    $('qrTitle').textContent = num + '번 우산 QR';
    $('qrImage').src = qrUrl;
    $('qrLink').textContent = link;
    var dl = $('qrDownload');
    dl.href = qrUrl;
    dl.setAttribute('download', 'umbrella-' + num + '-qr.png');
    $('qrModal').classList.add('show');
  }

  function closeQr() { $('qrModal').classList.remove('show'); }

  /* ===================== 관리자: 대여 기록 ===================== */
  async function loadHistory() {
    showLoading(true);
    var res = await api('/admin/history', { admin: true });
    showLoading(false);
    if (!res.ok) { handleAuthFail(res.message); return; }
    renderHistory(res.list);
  }

  function renderHistory(list) {
    var body = $('historyBody');
    if (!list.length) { body.innerHTML = '<tr><td colspan="6" class="empty">대여 기록이 없습니다.</td></tr>'; return; }

    body.innerHTML = list.map(function (it) {
      var isRented = it.status === '대여중';
      var tag = '<span class="tag ' + (isRented ? 'rented' : 'returned') + '">' + esc(it.status) + '</span>';
      return '<tr>' +
        '<td>' + esc(it.umbrellaNumber) + '</td>' +
        '<td>' + esc(it.name) + '</td>' +
        '<td>' + esc(it.studentId) + '</td>' +
        '<td>' + esc(it.rentTime) + '</td>' +
        '<td>' + (it.returnTime ? esc(it.returnTime) : '-') + '</td>' +
        '<td>' + tag + '</td>' +
      '</tr>';
    }).join('');
  }

  function handleAuthFail(msg) {
    toast(msg || '다시 로그인해주세요.', 'err');
    adminPassword = '';
    document.body.classList.remove('admin-on');
    switchTab('scan');
  }

  /* ===================== 이벤트 바인딩 ===================== */
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.tab').forEach(function (btn) {
      btn.addEventListener('click', function () { switchTab(btn.getAttribute('data-tab')); });
    });

    $('scanBtn').addEventListener('click', doScan);
    $('scanInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') doScan(); });

    $('adminEntry').addEventListener('click', showAdminLogin);
    $('loginCancel').addEventListener('click', function () { switchTab('scan'); });
    $('loginBtn').addEventListener('click', doLogin);
    $('adminPw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
    $('logoutBtn1').addEventListener('click', doLogout);
    $('logoutBtn2').addEventListener('click', doLogout);
    $('logoutBtn3').addEventListener('click', doLogout);

    $('refreshStatus').addEventListener('click', loadStatus);
    $('refreshManage').addEventListener('click', loadUmbrellas);
    $('refreshHistory').addEventListener('click', loadHistory);

    $('registerBtn').addEventListener('click', doRegister);

    $('qrClose').addEventListener('click', closeQr);
    $('qrModal').addEventListener('click', function (e) { if (e.target === $('qrModal')) closeQr(); });

    if (INITIAL_UMBRELLA) {
      $('scanInput').value = INITIAL_UMBRELLA;
      switchTab('scan');
      doScan();
    }
  });
  </script>
</body>
</html>
