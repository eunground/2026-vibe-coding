<style>
/* ===================== 기본 / 변수 ===================== */
:root {
  --primary: #1a73e8;
  --primary-dark: #1557b0;
  --bg: #f1f5f9;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #e5e7eb;

  --avail: #16a34a;       --avail-bg: #dcfce7;
  --rented: #ea8600;      --rented-bg: #fef3c7;
  --overdue: #dc2626;     --overdue-bg: #fee2e2;

  --radius: 14px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic",
               "Apple SD Gothic Neo", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 760px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===================== 헤더 ===================== */
.app-header {
  background: linear-gradient(135deg, var(--primary), #4f46e5);
  color: #fff;
  padding: 22px 18px;
  padding-top: calc(22px + env(safe-area-inset-top));
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand-logo { font-size: 38px; line-height: 1; }
.brand-text h1 { font-size: 21px; font-weight: 700; }
.brand-text p { font-size: 13px; opacity: .9; margin-top: 2px; }

/* ===================== 탭 ===================== */
.tabs {
  display: flex;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1 0 auto;
  padding: 14px 12px;
  border: none;
  background: none;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 3px solid transparent;
  transition: color .15s, border-color .15s;
}
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }

/* ===================== 콘텐츠 ===================== */
.content { flex: 1; padding: 16px; }
.view { display: none; animation: fade .25s ease; }
.view.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ===================== 카드 ===================== */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
  margin-bottom: 16px;
}
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-title { font-size: 17px; font-weight: 700; }
.card-desc { font-size: 13.5px; color: var(--muted); margin: 6px 0 14px; }

/* ===================== 입력 / 버튼 ===================== */
input {
  width: 100%;
  padding: 13px 14px;
  font-size: 16px;            /* iOS 자동 확대 방지 */
  border: 1.5px solid var(--border);
  border-radius: 10px;
  background: #fff;
  color: var(--text);
  transition: border-color .15s;
}
input:focus { outline: none; border-color: var(--primary); }

.search-row { display: flex; gap: 8px; }
.search-row input { flex: 1; }
.search-row .btn { flex: 0 0 auto; }

.form-grid { display: grid; gap: 10px; margin-bottom: 12px; }

.btn {
  padding: 13px 20px;
  font-size: 15px;
  font-weight: 700;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: transform .05s, background .15s, opacity .15s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-block { display: block; width: 100%; }
.btn-success { background: var(--avail); color: #fff; }
.btn-danger { background: var(--overdue); color: #fff; }
.btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
.btn:disabled { opacity: .55; cursor: default; }

.btn-text {
  background: none; border: none; color: var(--primary);
  font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 4px;
}

.inline-msg { margin-top: 10px; font-size: 14px; min-height: 18px; }
.inline-msg.ok { color: var(--avail); }
.inline-msg.err { color: var(--overdue); }

/* ===================== 우산 상태 결과 카드 ===================== */
.result-card { border-left: 6px solid var(--border); }
.result-card.available { border-left-color: var(--avail); }
.result-card.rented    { border-left-color: var(--rented); }
.result-card.overdue   { border-left-color: var(--overdue); }

.status-top { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.umb-num { font-size: 26px; font-weight: 800; }
.umb-name { font-size: 14px; color: var(--muted); }

.badge {
  display: inline-block; padding: 5px 12px; border-radius: 999px;
  font-size: 13px; font-weight: 700;
}
.badge.available { background: var(--avail-bg); color: var(--avail); }
.badge.rented    { background: var(--rented-bg); color: var(--rented); }
.badge.overdue   { background: var(--overdue-bg); color: var(--overdue); }
.badge.notreg    { background: #e5e7eb; color: var(--muted); }

.info-box {
  background: var(--bg); border-radius: 10px; padding: 12px 14px;
  margin: 14px 0; font-size: 14px;
}
.info-box .row { display: flex; justify-content: space-between; padding: 3px 0; }
.info-box .row span:first-child { color: var(--muted); }
.info-box .row span:last-child { font-weight: 600; }

.section-label { font-size: 13px; font-weight: 700; color: var(--muted); margin: 16px 0 8px; }

/* ===================== 통계 그리드 ===================== */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
.stat {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px 8px; text-align: center;
}
.stat-num { display: block; font-size: 26px; font-weight: 800; line-height: 1.1; }
.stat-label { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.stat-total .stat-num { color: var(--primary); }
.stat-avail .stat-num { color: var(--avail); }
.stat-rented .stat-num { color: var(--rented); }
.stat-overdue .stat-num { color: var(--overdue); }

/* ===================== 리스트 (대여중/우산목록) ===================== */
.list { display: flex; flex-direction: column; gap: 10px; }
.list-item {
  border: 1px solid var(--border); border-radius: 12px; padding: 14px;
  display: flex; align-items: center; gap: 12px;
}
.list-item.overdue { border-color: var(--overdue); background: var(--overdue-bg); }
.li-main { flex: 1; min-width: 0; }
.li-title { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.li-sub { font-size: 13px; color: var(--muted); margin-top: 4px; word-break: break-all; }
.li-actions { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
.li-actions .btn { padding: 9px 14px; font-size: 13px; }

.dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
.dot.available { background: var(--avail); }
.dot.rented { background: var(--rented); }
.dot.overdue { background: var(--overdue); }

.empty { text-align: center; color: var(--muted); padding: 28px 10px; font-size: 14px; }

/* ===================== 관리자 바 ===================== */
.admin-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.admin-badge {
  background: #eef2ff; color: var(--primary); font-size: 13px; font-weight: 700;
  padding: 6px 12px; border-radius: 999px;
}

/* ===================== 로그인 ===================== */
.login-card { text-align: center; max-width: 380px; margin: 30px auto; }
.lock-icon { font-size: 44px; margin-bottom: 8px; }
.login-card .search-row { margin-top: 8px; }

/* ===================== 테이블 (대여 기록) ===================== */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 520px; }
.data-table th, .data-table td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
.data-table th { color: var(--muted); font-weight: 700; background: var(--bg); position: sticky; top: 0; }
.tag { padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.tag.rented { background: var(--rented-bg); color: var(--rented); }
.tag.returned { background: var(--avail-bg); color: var(--avail); }

/* ===================== QR 모달 ===================== */
.modal {
  display: none; position: fixed; inset: 0; z-index: 50;
  background: rgba(0,0,0,.55); align-items: center; justify-content: center; padding: 20px;
}
.modal.show { display: flex; }
.modal-box {
  background: #fff; border-radius: 18px; padding: 24px; text-align: center;
  max-width: 340px; width: 100%; position: relative;
}
.modal-box h3 { font-size: 18px; margin-bottom: 16px; }
.modal-box img { width: 220px; height: 220px; border-radius: 10px; }
.modal-close {
  position: absolute; top: 12px; right: 14px; background: none; border: none;
  font-size: 20px; cursor: pointer; color: var(--muted);
}
.qr-link { font-size: 12px; color: var(--muted); margin: 12px 0 16px; word-break: break-all; }

/* ===================== 로딩 / 토스트 ===================== */
.overlay {
  display: none; position: fixed; inset: 0; z-index: 60;
  background: rgba(255,255,255,.6); align-items: center; justify-content: center;
}
.overlay.show { display: flex; }
.spinner {
  width: 42px; height: 42px; border: 4px solid var(--border);
  border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
  background: #1f2937; color: #fff; padding: 13px 20px; border-radius: 10px;
  font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s; z-index: 70; max-width: 90%; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--overdue); }
.toast.ok { background: var(--avail); }

/* ===================== 푸터 ===================== */
.app-footer {
  text-align: center; font-size: 12px; color: var(--muted);
  padding: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom));
}

/* ===================== 반응형 ===================== */
@media (max-width: 480px) {
  .brand-text h1 { font-size: 18px; }
  .tab { font-size: 13px; padding: 13px 10px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .umb-num { font-size: 22px; }
  .list-item { flex-direction: column; align-items: stretch; }
  .li-actions { flex-direction: row; }
  .li-actions .btn { flex: 1; }
}

@media (min-width: 768px) {
  .form-grid { grid-template-columns: 1fr 1fr; }
}
</style>
