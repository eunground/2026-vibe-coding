<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('Stylesheet'); ?>
</head>
<body>
  <div class="app">

    <!-- 헤더 -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-logo">☂️</span>
        <div class="brand-text">
          <h1>학교 우산 대여</h1>
          <p>필요할 때 빌리고, 다 쓰면 반납해요</p>
        </div>
      </div>
    </header>

    <!-- 탭 네비게이션 -->
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="scan">🔍 우산 스캔</button>
      <button class="tab" data-tab="status">📋 대여 현황</button>
      <button class="tab" data-tab="manage">☂️ 우산 관리</button>
      <button class="tab" data-tab="history">🕓 대여 기록</button>
    </nav>

    <main class="content">

      <!-- ========== 1. 우산 스캔 (학생) ========== -->
      <section class="view active" id="view-scan">
        <div class="card">
          <h2 class="card-title">우산 번호 확인</h2>
          <p class="card-desc">우산에 적힌 번호를 입력하거나 QR을 스캔해 접속하세요.</p>
          <div class="search-row">
            <input type="text" id="scanInput" inputmode="text" placeholder="예: 12" autocomplete="off">
            <button class="btn btn-primary" id="scanBtn">확인</button>
          </div>
        </div>

        <!-- 조회 결과 영역 -->
        <div id="scanResult"></div>
      </section>

      <!-- ========== 관리자 로그인 게이트 ========== -->
      <section class="view" id="view-login" style="display:none">
        <div class="card login-card">
          <div class="lock-icon">🔒</div>
          <h2 class="card-title">관리자 로그인</h2>
          <p class="card-desc">관리자 비밀번호를 입력하세요.</p>
          <div class="search-row">
            <input type="password" id="adminPw" placeholder="비밀번호" autocomplete="current-password">
            <button class="btn btn-primary" id="loginBtn">로그인</button>
          </div>
          <div id="loginMsg" class="inline-msg"></div>
        </div>
      </section>

      <!-- ========== 2. 대여 현황 (관리자) ========== -->
      <section class="view admin-view" id="view-status">
        <div class="admin-bar">
          <span class="admin-badge">👤 관리자</span>
          <button class="btn-text" id="logoutBtn1">로그아웃</button>
        </div>

        <div class="stats-grid">
          <div class="stat stat-total">  <span class="stat-num" id="statTotal">-</span>   <span class="stat-label">전체 우산</span></div>
          <div class="stat stat-avail">  <span class="stat-num" id="statAvail">-</span>   <span class="stat-label">대여 가능</span></div>
          <div class="stat stat-rented"> <span class="stat-num" id="statRented">-</span>  <span class="stat-label">대여 중</span></div>
          <div class="stat stat-overdue"><span class="stat-num" id="statOverdue">-</span> <span class="stat-label">연체</span></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2 class="card-title">대여 중인 우산</h2>
            <button class="btn-text" id="refreshStatus">↻ 새로고침</button>
          </div>
          <div id="activeList" class="list"></div>
        </div>
      </section>

      <!-- ========== 3. 우산 관리 (관리자) ========== -->
      <section class="view admin-view" id="view-manage">
        <div class="admin-bar">
          <span class="admin-badge">👤 관리자</span>
          <button class="btn-text" id="logoutBtn2">로그아웃</button>
        </div>

        <div class="card">
          <h2 class="card-title">우산 등록</h2>
          <div class="form-grid">
            <input type="text" id="newUmbNumber" placeholder="우산 번호 (예: 12)">
            <input type="text" id="newUmbName" placeholder="우산명 (선택, 예: 장우산)">
          </div>
          <button class="btn btn-primary btn-block" id="registerBtn">＋ 우산 등록</button>
          <div id="manageMsg" class="inline-msg"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2 class="card-title">등록된 우산 · QR</h2>
            <button class="btn-text" id="refreshManage">↻ 새로고침</button>
          </div>
          <div id="umbList" class="list"></div>
        </div>
      </section>

      <!-- ========== 4. 대여 기록 (관리자) ========== -->
      <section class="view admin-view" id="view-history">
        <div class="admin-bar">
          <span class="admin-badge">👤 관리자</span>
          <button class="btn-text" id="logoutBtn3">로그아웃</button>
        </div>

        <div class="card">
          <div class="card-head">
            <h2 class="card-title">전체 대여 기록</h2>
            <button class="btn-text" id="refreshHistory">↻ 새로고침</button>
          </div>
          <div class="table-wrap">
            <table class="data-table" id="historyTable">
              <thead>
                <tr><th>우산</th><th>이름</th><th>학번</th><th>대여</th><th>반납</th><th>상태</th></tr>
              </thead>
              <tbody id="historyBody"></tbody>
            </table>
          </div>
        </div>
      </section>

    </main>

    <footer class="app-footer">☔ 우산 대여 시스템 · 24시간 이상 미반납 시 연체 처리</footer>
  </div>

  <!-- 로딩 오버레이 -->
  <div class="overlay" id="overlay"><div class="spinner"></div></div>

  <!-- QR 모달 -->
  <div class="modal" id="qrModal">
    <div class="modal-box">
      <button class="modal-close" id="qrClose">✕</button>
      <h3 id="qrTitle">QR 코드</h3>
      <img id="qrImage" alt="QR 코드" />
      <p class="qr-link" id="qrLink"></p>
      <a class="btn btn-primary btn-block" id="qrDownload" download>QR 이미지 저장</a>
    </div>
  </div>

  <!-- 토스트 -->
  <div class="toast" id="toast"></div>

  <!-- 서버에서 주입되는 QR 진입 파라미터 -->
  <script>
    var INITIAL_UMBRELLA = "<?= umbrellaParam ?>";
  </script>
  <?!= include('JavaScript'); ?>
</body>
</html>
